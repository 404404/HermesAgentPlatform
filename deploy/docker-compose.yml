services:
  mysql:
    image: mysql:8.0
    container_name: hep-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hep}
      MYSQL_USER: ${MYSQL_USER:-hep}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hep_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ChangeMe-Root-2026!}
      TZ: UTC
    volumes:
      - hep-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [hep]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://mirrors.aliyun.com/goproxy/}
    container_name: hep-backend
    environment:
      DB_DSN: ${DB_DSN:-hep:hep_password@tcp(mysql:3306)/hep?parseTime=true&charset=utf8mb4&loc=UTC}
      PORT: 8080
      MIGRATIONS_DIR: /app/migrations
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe-Admin-2026!}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:18080}
      TZ: UTC
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-18081}:8080"
    networks: [hep]
    volumes:
      - ./backend/migrations:/app/migrations:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hep-frontend
    depends_on: [backend]
    ports:
      - "${FRONTEND_PORT:-18080}:80"
    networks: [hep]
    restart: unless-stopped

volumes:
  hep-mysql-data:

networks:
  hep:
    name: hep-network
